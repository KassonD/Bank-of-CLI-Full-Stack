# Test-only configuration. This file shadows src/main/resources/application.properties
# on the test classpath, so tests never touch RDS and need no DB_URL/DB_USERNAME/DB_PASSWORD.
spring.datasource.url=jdbc:h2:mem:bankofcli;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=TRANSACTION,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate builds the schema from the entities, so the tests stay in step with the mappings.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
