# Test-only configuration. This file shadows src/main/resources/application.properties
# on the test classpath.
#
# The datasource is pinned to in-memory H2 ON PURPOSE. Do not point it at
# ${DB_URL}: with ddl-auto=create-drop that runs DROP TABLE and the
# @BeforeEach deleteAll() calls against whatever database DB_URL names,
# which on this project is RDS.
spring.datasource.url=jdbc:h2:mem:bankofcli;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=TRANSACTION,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate builds the schema from the entities, so the tests stay in step
# with the mappings. Safe here only because the datasource above is in-memory.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security settings for local integration tests
app.security.csrf-cookie.same-site=Lax
app.cookie.secure=false
