# Test-only configuration. This file shadows src/main/resources/application.properties
# on the test classpath, so tests run against in-memory H2 and need no DB_URL,
# DB_USERNAME or DB_PASSWORD.

# In-memory H2 in PostgreSQL compatibility mode. TRANSACTION and VALUE are H2
# reserved words that the entity mappings use as identifiers, so they are excluded.
spring.datasource.url=jdbc:h2:mem:bankofcli;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=TRANSACTION,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate builds the schema from the entities, so the tests stay in step with the mappings.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Required by SecurityConfig's @Value; the main properties file is shadowed on the
# test classpath, so it has to be defined here too.
app.security.csrf-cookie.same-site=Lax
app.cookie.secure=false
